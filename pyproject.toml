[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dvrrestorer"
version = "0.1.0.dev0"
description = "Open-source timeline-based restorer for analog FPV DVR footage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Froscht" }]
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.24",
    "scipy>=1.11",
    "onnxruntime>=1.17",
    "imageio-ffmpeg>=0.4",
    "customtkinter>=5.2",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cuda = ["onnxruntime-gpu"]
dml = ["onnxruntime-directml"]
coreml = ["onnxruntime-coreml"]

[project.scripts]
dvrrestorer-cli = "dvrrestorer.cli:main"
dvrrestorer-gui = "dvrrestorer.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["dvrrestorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: tests that require a display / Tk event loop",
]
